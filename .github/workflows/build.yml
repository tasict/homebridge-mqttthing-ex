name: Build and Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:ui
      - run: npm run generate:schema
      # config.schema.json is generated but committed, so drift is a build
      # failure rather than something discovered at publish time
      - run: git diff --exit-code config.schema.json
      - run: npm test
